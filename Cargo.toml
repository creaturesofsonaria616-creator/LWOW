[package]
name = "lwow"
version = "0.1.0"
edition = "2021"
description = "Lwow - a lightweight customizable browser"
authors = ["Lwow"]
license = "MIT"
build = "build.rs"

[build-dependencies]
slint-build = "1.13"

[dependencies]
slint = { version = "1.13", features = ["renderer-skia", "raw-window-handle-06"] }
wry = { version = "0.57", features = ["devtools"] }
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
