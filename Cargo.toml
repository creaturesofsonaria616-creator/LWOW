[package]
name = "lwow"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = { version = "1.13", features = ["renderer-skia"] }
wry = { version = "0.57", features = ["devtools"] }
raw-window-handle = "0.6"
rusqlite = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "fat"
